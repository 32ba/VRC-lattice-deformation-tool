name: Build Release

on: 
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified archives, tag, and VPM update
        type: boolean
        default: false

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      # Checkout Local Repository
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate token
        if: inputs.publish
        id: generate_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: vpm.32ba.net

      - name: Test package builder
        run: python3 -m unittest discover -s Tools~/Release -p 'test_*.py'

      - name: Build and verify release archives
        id: package
        run: python3 Tools~/Release/package_release.py --commit HEAD --output release-artifacts --github-output "$GITHUB_OUTPUT"

      - name: Retain verified archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verification
          path: release-artifacts/
          if-no-files-found: error

      - name: Reject an existing release tag
        if: inputs.publish
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$PACKAGE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "package.json contains an invalid release version: $PACKAGE_VERSION" >&2
            exit 1
          fi
          git fetch --force --tags
          if git rev-parse --verify --quiet "refs/tags/$PACKAGE_VERSION"; then
            echo "Release tag $PACKAGE_VERSION already exists. Bump package.json before releasing." >&2
            exit 1
          fi
    
      # Make a release tag of the version from the package.json file 
      - name: Create Tag
        if: inputs.publish
        id: tag_version
        uses: rickstaa/action-create-tag@88dbf7ff6fe2405f8e8f6c6fdfd78829bc631f83
        with:
          tag: "${{ steps.package.outputs.version }}"
      
      # Publish the Release to GitHub
      - name: Make Release
        if: inputs.publish
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        with:
          files: |
            release-artifacts/${{ steps.package.outputs.zipFile }}
            release-artifacts/${{ steps.package.outputs.unityPackage }}
            release-artifacts/package.json
          tag_name: ${{ steps.package.outputs.version }}
          prerelease: ${{ steps.package.outputs.prerelease == 'true' }}

      # Update listing using the GitHub API
      - name: Update VPM repository
        if: inputs.publish
        run: |
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer ${{ steps.generate_token.outputs.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository_owner }}/vpm.32ba.net/dispatches \
            -d '{"event_type": "update-listing", "client_payload": {}}'
