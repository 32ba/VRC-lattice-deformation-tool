name: Apply PR 87 review fixes

on:
  push:
    branches:
      - automation/pr87-review-fix

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: automation/pr87-review-fix
          fetch-depth: 0
      - name: Preserve helper and switch to PR branch
        shell: bash
        run: |
          cp .github/pr87_review_fix.py /tmp/pr87_review_fix.py
          git fetch origin fix/hardening-audit-findings
          git checkout -B fix/hardening-audit-findings origin/fix/hardening-audit-findings
      - name: Apply review fixes
        shell: bash
        run: |
          python3 /tmp/pr87_review_fix.py
          git diff --check
      - name: Commit review fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Runtime/MeshDeformer/LatticeDeformer.cs \
                  Editor/MeshDeformer/Utilities/ClearanceQuery.cs \
                  Editor/MeshDeformer/Utilities/FitCorrectionGenerator.cs \
                  Editor/MeshDeformer/Utilities/TopologySeamUtility.cs \
                  Editor/MeshDeformer/Utilities/TopologySeamUtility.cs.meta \
                  Tests/Editor/HardeningAuditRegressionTests.cs
          git commit -m "fix: address hardening review feedback"
          git push origin HEAD:fix/hardening-audit-findings
